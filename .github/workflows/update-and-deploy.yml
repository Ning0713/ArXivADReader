name: Update And Deploy Papers

on:
  push:
    branches: [main]
  schedule:
    # GitHub cron uses UTC: 05:00 UTC is 13:00 on weekdays in Asia/Shanghai.
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD or today)"
        required: false
        default: "today"
        type: string
      force:
        description: "Refetch an existing date"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Fetch and classify without committing or deploying"
        required: false
        default: false
        type: boolean
      allow_arxiv_discovery:
        description: "Explicitly allow arXiv-only candidate fallback"
        required: false
        default: false
        type: boolean

concurrency:
  group: adpaper-update
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_deploy: ${{ steps.deployment-plan.outputs.should_deploy }}
      target_date: ${{ steps.update.outputs.target_date }}
      update_status: ${{ steps.update.outputs.status }}
      update_changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Update and classify
        id: update
        if: ${{ github.event_name != 'push' }}
        env:
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || 'today' }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          ARXIV_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_arxiv_discovery || 'false' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          args=(--date "$TARGET_DATE")
          if [[ "$FORCE_UPDATE" == "true" ]]; then args+=(--force); fi
          if [[ "$ARXIV_FALLBACK" == "true" ]]; then args+=(--allow-arxiv-discovery); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          report_file="$RUNNER_TEMP/adpaper-update-report.json"
          : > "$report_file"
          set +e
          python -m adpaper update "${args[@]}" >"$report_file"
          exit_code=$?
          set -e
          cat "$report_file"

          # Keep the machine-readable report visible in the run summary. This
          # makes a skipped deployment distinguishable from a source failure
          # or an already-existing date.
          if [[ -s "$report_file" ]] && jq -e . "$report_file" >/dev/null 2>&1; then
            target_date=$(jq -r '.date // empty' "$report_file")
            status=$(jq -r '.status // empty' "$report_file")
            changed=$(jq -r '.changed // false' "$report_file")
            candidate_count=$(jq -r '.candidate_count // 0' "$report_file")
            selected_count=$(jq -r '.selected_count // 0' "$report_file")
            echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "changed=$changed" >> "$GITHUB_OUTPUT"
            {
              echo "### Paper update"
              echo "- Target date: \`$target_date\`"
              echo "- Status: \`$status\`"
              echo "- Candidates: \`$candidate_count\`; selected: \`$selected_count\`"
              echo "- Changed data: \`$changed\`"
              if [[ "$status" == "failed" ]]; then
                echo "- Warnings:"
                jq -r '.warnings[]? | "  - " + .' "$report_file"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### Paper update" >> "$GITHUB_STEP_SUMMARY"
            echo "Update command did not produce a valid JSON report." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$exit_code"
      - name: Stop after preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "Preview completed; no commit or deployment requested."
      - name: Plan deployment
        id: deployment-plan
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPDATE_CHANGED: ${{ steps.update.outputs.changed }}
          UPDATE_STATUS: ${{ steps.update.outputs.status }}
          TARGET_DATE: ${{ steps.update.outputs.target_date }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          # A successful scheduled/manual update should always publish the
          # generated site.  Checking only git status caused false skips when
          # the update report and the checkout were out of sync.
          elif [[ "$UPDATE_STATUS" == "updated" || "$UPDATE_STATUS" == "unchanged" || "$UPDATE_CHANGED" == "true" || -n "$(git status --porcelain -- data)" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "No data changes for ${TARGET_DATE:-the requested date}; skipping build and deployment."
          fi
      - name: Validate and build
        if: ${{ steps.deployment-plan.outputs.should_deploy == 'true' }}
        run: |
          python -m adpaper validate
          python -m adpaper build
      - name: Commit generated data
        if: ${{ github.event_name != 'push' && steps.deployment-plan.outputs.should_deploy == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): update papers"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        if: ${{ steps.deployment-plan.outputs.should_deploy == 'true' }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ steps.deployment-plan.outputs.should_deploy == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: ${{ needs.update.outputs.should_deploy == 'true' }}
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove stale Pages deployments
        if: ${{ success() }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const deployments = await github.paginate(github.rest.repos.listDeployments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: "github-pages",
                per_page: 100,
              });
              const ordered = deployments.sort(
                (left, right) => new Date(right.created_at) - new Date(left.created_at),
              );
              const current = ordered[0];
              if (current) {
                core.info(`Keeping current deployment ${current.id}.`);
              }
              for (const deployment of ordered.slice(1)) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 1,
                });
                const state = statuses.data[0]?.state;
                try {
                  if (state !== 'inactive') {
                    await github.rest.repos.createDeploymentStatus({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      deployment_id: deployment.id,
                      state: "inactive",
                    });
                  }
                  await github.rest.repos.deleteDeployment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: deployment.id,
                  });
                  core.info(`Deleted stale deployment ${deployment.id}.`);
                } catch (error) {
                  core.warning(`Could not delete deployment ${deployment.id}: ${error.message}`);
                }
              }
            } catch (error) {
              core.warning(`Could not inspect Pages deployments: ${error.message}`);
            }
