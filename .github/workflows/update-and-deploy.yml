name: Update And Deploy Papers

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD or today)"
        required: false
        default: "today"
        type: string
      force:
        description: "Refetch an existing date"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Fetch and classify without committing or deploying"
        required: false
        default: false
        type: boolean
      allow_arxiv_discovery:
        description: "Explicitly allow arXiv-only candidate fallback"
        required: false
        default: false
        type: boolean

concurrency:
  group: adpaper-update
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_deploy: ${{ steps.deployment-plan.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Update and classify
        if: ${{ github.event_name != 'push' }}
        env:
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || 'today' }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          ARXIV_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_arxiv_discovery || 'false' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          args=(--date "$TARGET_DATE")
          if [[ "$FORCE_UPDATE" == "true" ]]; then args+=(--force); fi
          if [[ "$ARXIV_FALLBACK" == "true" ]]; then args+=(--allow-arxiv-discovery); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python -m adpaper update "${args[@]}"
      - name: Stop after preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "Preview completed; no commit or deployment requested."
      - name: Plan deployment
        id: deployment-plan
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$(git status --porcelain -- data)" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "No data changes; skipping build and deployment."
          fi
      - name: Validate and build
        if: ${{ steps.deployment-plan.outputs.should_deploy == 'true' }}
        run: |
          python -m adpaper validate
          python -m adpaper build
      - name: Commit generated data
        if: ${{ github.event_name != 'push' && steps.deployment-plan.outputs.should_deploy == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): update papers"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        if: ${{ steps.deployment-plan.outputs.should_deploy == 'true' }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ steps.deployment-plan.outputs.should_deploy == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: ${{ needs.update.outputs.should_deploy == 'true' }}
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove stale Pages deployments
        if: ${{ success() }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const deployments = await github.paginate(github.rest.repos.listDeployments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: "github-pages",
                per_page: 100,
              });
              const ordered = deployments.sort(
                (left, right) => new Date(right.created_at) - new Date(left.created_at),
              );
              const current = ordered[0];
              if (current) {
                core.info(`Keeping current deployment ${current.id}.`);
              }
              for (const deployment of ordered.slice(1)) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 1,
                });
                const state = statuses.data[0]?.state;
                try {
                  if (state !== 'inactive') {
                    await github.rest.repos.createDeploymentStatus({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      deployment_id: deployment.id,
                      state: "inactive",
                    });
                  }
                  await github.rest.repos.deleteDeployment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: deployment.id,
                  });
                  core.info(`Deleted stale deployment ${deployment.id}.`);
                } catch (error) {
                  core.warning(`Could not delete deployment ${deployment.id}: ${error.message}`);
                }
              }
            } catch (error) {
              core.warning(`Could not inspect Pages deployments: ${error.message}`);
            }
